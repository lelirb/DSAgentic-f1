<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic DS — Resultado de la evaluación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#0B1220; --ink-800:#12172B; --ink-600:#3B4258;
    --gray-500:#5B6472; --gray-300:#9AA3B2; --gray-100:#E7EAF0;
    --paper:#FFFFFF; --paper-tint:#F3F5FA;
    --indigo-600:#3D5AFE; --indigo-700:#2F46D6; --indigo-100:#E8ECFF; --indigo-050:#F3F5FF;
    --green-600:#16A34A; --green-100:#DCFCE7;
    --amber-500:#D97E00; --red-600:#B91C1C;
    --focus-ring:#3D5AFE;
    --radius-md:12px; --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(11,18,32,0.06);
    --shadow-md:0 8px 24px rgba(11,18,32,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans', system-ui, sans-serif;color:var(--ink-800);background:var(--paper-tint);-webkit-font-smoothing:antialiased;}
  code,.mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:4px;}
  .wrap{max-width:900px;margin:0 auto;padding:0 24px;}

  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--gray-100);}
  nav.wrap{display:flex;align-items:center;justify-content:space-between;height:72px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;color:var(--ink-900);text-decoration:none;}
  .back-link{font-size:14px;font-weight:600;color:var(--indigo-700);text-decoration:none;}
  .lang-toggle{display:flex;align-items:center;background:var(--gray-100);border-radius:999px;padding:3px;border:none;gap:2px;}
  .lang-toggle button{border:none;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--gray-500);}
  .lang-toggle button[aria-pressed="true"]{background:var(--paper);color:var(--indigo-700);box-shadow:var(--shadow-sm);}

  main{padding:40px 0 80px;}
  h1{font-size:26px;font-weight:700;color:var(--ink-900);margin:0 0 4px;}
  .subtitle{font-size:14px;color:var(--gray-500);margin:0 0 28px;word-break:break-all;}

  .note{font-size:13.5px;border-radius:10px;padding:12px 14px;margin-bottom:20px;}
  .note-info{background:var(--indigo-050);color:var(--indigo-700);}
  .note-warn{background:#FFF7ED;color:#9A3412;}

  .hero-score{background:var(--paper);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-sm);margin-bottom:28px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
  .hero-score .num-block{display:flex;align-items:center;gap:16px;}
  .hero-score .score-big{font-size:48px;font-weight:700;color:var(--ink-900);line-height:1;}
  .hero-score .score-big small{font-size:20px;font-weight:500;color:var(--gray-300);}
  .hero-score .meta{flex:1;min-width:200px;}
  .hero-score .level{font-size:15px;font-weight:600;margin-bottom:4px;}
  .hero-score .level-Opaco{color:var(--red-600);}
  .hero-score .level-Legible{color:var(--amber-500);}
  .hero-score .level-Interpretable{color:var(--indigo-700);}
  .hero-score .level-Operable{color:var(--green-600);}
  .hero-score .gate-note{font-size:12.5px;color:var(--gray-500);margin-top:8px;}

  .section-title{font-size:13px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.03em;margin:32px 0 14px;}

  .dim-detail{background:var(--paper);border:1px solid var(--gray-100);border-radius:var(--radius-md);padding:20px;margin-bottom:14px;}
  .dim-detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px;}
  .dim-detail-head .name{font-size:15px;font-weight:600;color:var(--ink-900);}
  .dim-detail-head .score{font-size:15px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
  .dim-bar-track{height:6px;background:var(--gray-100);border-radius:99px;overflow:hidden;margin-bottom:14px;}
  .dim-bar-fill{height:100%;border-radius:99px;background:var(--indigo-600);}
  .dim-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:13px;}
  .dim-cols .label{font-weight:600;color:var(--gray-500);margin-bottom:6px;text-transform:uppercase;font-size:11px;letter-spacing:.02em;}
  .dim-cols ul{margin:0;padding-left:18px;color:var(--ink-600);line-height:1.6;}
  .dim-why{font-size:13px;color:var(--gray-500);margin-top:14px;padding-top:12px;border-top:1px solid var(--gray-100);}
  .dim-reco{font-size:13px;color:var(--indigo-700);margin-top:8px;font-weight:500;}
  .dim-na{color:var(--gray-300);font-style:italic;}

  .finding-item{background:var(--paper);border:1px solid var(--gray-100);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;line-height:1.55;}
  .finding-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .sev-badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;padding:2px 8px;border-radius:99px;}
  .sev-CRITICAL{background:#FEE2E2;color:#991B1B;}
  .sev-HIGH{background:#FFEDD5;color:#9A3412;}
  .sev-MEDIUM{background:#FEF3C7;color:#92400E;}
  .sev-LOW{background:var(--gray-100);color:var(--gray-500);}
  .dim-tag{font-size:11px;font-weight:700;color:var(--indigo-700);font-family:'IBM Plex Mono',monospace;}
  .finding-body{color:var(--ink-600);margin-bottom:4px;}
  .finding-reco{color:var(--gray-500);font-style:italic;}

  .limitations{background:var(--paper);border:1px solid var(--gray-100);border-radius:var(--radius-md);padding:18px 20px;}
  .limitations ul{margin:0;padding-left:18px;color:var(--gray-500);font-size:13px;line-height:1.7;}

  .empty-state{background:var(--paper);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;}
  .empty-state h2{font-size:18px;color:var(--ink-900);margin:0 0 8px;}
  .empty-state p{color:var(--gray-500);font-size:14px;margin:0 0 20px;}
  .btn-primary{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;font-size:15px;font-weight:600;text-decoration:none;border:none;background:var(--indigo-600);color:#fff;}
  .btn-primary:hover{background:var(--indigo-700);}

  @media (max-width:640px){
    .dim-cols{grid-template-columns:1fr;}
    .hero-score{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z" stroke="#3D5AFE" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 12l10 5 10-5" stroke="#3D5AFE" stroke-width="1.6" stroke-linejoin="round"/></svg>
      Agentic DS
    </a>
    <a href="index.html" class="back-link" data-i18n="results.back">← Evaluate another Design System</a>
    <div class="lang-toggle" role="group" aria-label="Language selector / Selector de idioma">
      <button type="button" id="btn-es" aria-pressed="true">ES</button>
      <button type="button" id="btn-en" aria-pressed="false">EN</button>
    </div>
  </nav>
</header>

<main class="wrap" id="page-root">
  <!-- filled by JS -->
</main>

<script src="i18n.js"></script>
<script>
  const dict = window.AgenticDSDict;
  let currentLang = 'es';
  function t(key){ return dict[currentLang][key] ?? key; }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const DIM_KEYS = ['D1','D2','D3','D4','D5','D6'];
  const root = document.getElementById('page-root');

  function setLang(lang){
    currentLang = lang;
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      if(dict[lang][key] !== undefined) el.textContent = dict[lang][key];
    });
    document.getElementById('btn-es').setAttribute('aria-pressed', lang==='es');
    document.getElementById('btn-en').setAttribute('aria-pressed', lang==='en');
    localStorage.setItem('agentic-ds-lang', lang);
    render(); // re-render the dynamic content in the new language
  }
  document.getElementById('btn-es').addEventListener('click', ()=>setLang('es'));
  document.getElementById('btn-en').addEventListener('click', ()=>setLang('en'));

  function renderEmptyState(){
    root.innerHTML = `
      <div class="empty-state">
        <h2>${escapeHtml(t('results.none.title'))}</h2>
        <p>${escapeHtml(t('results.none.body'))}</p>
        <a href="index.html" class="btn-primary">${escapeHtml(t('results.none.cta'))}</a>
      </div>`;
  }

  function levelColorClass(level){
    return 'level-' + (level || '').replace(/[^A-Za-z]/g, '');
  }

  function render(){
    let stored;
    try { stored = JSON.parse(sessionStorage.getItem('agentic-ds-last-result')); } catch { stored = null; }
    if (!stored || !stored.report){
      renderEmptyState();
      return;
    }
    const report = stored.report;
    const meta = { mode: stored.mode };
    const ov = report.overview;

    document.title = 'Agentic DS — ' + t('results.title');

    // ---- mode / data-sufficiency notes ----
    let notesHtml = '';
    notesHtml += `<div class="note note-info">${escapeHtml(t(meta.mode === 'demo' ? 'results.mode.demo' : 'results.mode.live'))}</div>`;
    if (ov.data_sufficiency === 'INSUFFICIENT_D1') {
      notesHtml += `<div class="note note-warn">${escapeHtml(t('form.note.insufficient_d1'))}</div>`;
    } else if (ov.data_sufficiency === 'INSUFFICIENT_COVERAGE') {
      notesHtml += `<div class="note note-warn">${escapeHtml(t('form.note.insufficient_coverage'))}</div>`;
    }

    // ---- hero score ----
    let heroHtml;
    if (ov.global_score === null) {
      heroHtml = `
        <div class="hero-score">
          <div class="num-block"><div class="score-big" style="color:var(--gray-300)">—<small>/100</small></div></div>
          <div class="meta"><div class="level" style="color:var(--gray-500)">${escapeHtml(t('results.global_score'))}</div></div>
        </div>`;
    } else {
      const score = ov.global_score;
      const level = ov.readiness_level || '';
      const gateNote = report.gate && report.gate.applied
        ? `<div class="gate-note">${escapeHtml(t('results.gate_note'))}</div>` : '';
      heroHtml = `
        <div class="hero-score">
          <div class="num-block"><div class="score-big">${score}<small>/100</small></div></div>
          <div class="meta">
            <div class="level ${levelColorClass(level)}">${escapeHtml(t('results.global_score'))}: ${escapeHtml(level)}</div>
            ${gateNote}
          </div>
        </div>`;
    }

    // ---- per-dimension detail ----
    const dimsHtml = DIM_KEYS.map(k => {
      const d = report.dimensions[k];
      const diag = report.diagnosis ? report.diagnosis[k] : null;
      const name = escapeHtml(t(`dim.${k.toLowerCase()}.title`));
      const score = d.score === null || d.score === undefined ? null : Math.round(d.score);

      if (score === null) {
        return `
          <div class="dim-detail">
            <div class="dim-detail-head"><span class="name">${k} · ${name}</span><span class="score dim-na">—</span></div>
            <p class="dim-na" style="font-size:13px;">${escapeHtml(diag ? diag.summary : '')}</p>
          </div>`;
      }

      const works = diag && diag.works && diag.works.length ? diag.works.join(', ') : t('results.none_at_max');
      const gaps = diag && diag.gaps && diag.gaps.length ? diag.gaps.join(', ') : t('results.none_gaps');
      const why = diag ? diag.why_it_matters : '';
      const reco = diag ? diag.recommendation : '';

      return `
        <div class="dim-detail">
          <div class="dim-detail-head"><span class="name">${k} · ${name}</span><span class="score" style="color:${score>=76?'var(--green-600)':score>=51?'var(--indigo-700)':score>=26?'var(--amber-500)':'var(--red-600)'}">${score}/100</span></div>
          <div class="dim-bar-track"><div class="dim-bar-fill" style="width:${score}%;"></div></div>
          <div class="dim-cols">
            <div><div class="label">${escapeHtml(t('results.works'))}</div><ul><li>${escapeHtml(works)}</li></ul></div>
            <div><div class="label">${escapeHtml(t('results.gaps'))}</div><ul><li>${escapeHtml(gaps)}</li></ul></div>
          </div>
          ${why ? `<div class="dim-why"><strong>${escapeHtml(t('results.why_it_matters'))}:</strong> ${escapeHtml(why)}</div>` : ''}
          ${reco ? `<div class="dim-reco">→ ${escapeHtml(reco)}</div>` : ''}
        </div>`;
    }).join('');

    // ---- findings ----
    const findings = report.findings || [];
    const findingsHtml = findings.length
      ? findings.map(f => `
          <div class="finding-item">
            <div class="finding-head">
              <span class="sev-badge sev-${escapeHtml(f.severity)}">${escapeHtml(t('results.severity.' + f.severity))}</span>
              <span class="dim-tag">${escapeHtml(f.dimension)}</span>
              ${f.component ? `<span style="font-size:12px;color:var(--gray-300);">${escapeHtml(f.component)}</span>` : ''}
            </div>
            <div class="finding-body">${escapeHtml(f.finding)}</div>
            ${f.recommendation ? `<div class="finding-reco">→ ${escapeHtml(f.recommendation)}</div>` : ''}
          </div>`).join('')
      : `<p style="color:var(--gray-500);font-size:13.5px;">${escapeHtml(t('results.findings.none'))}</p>`;

    const langNote = findings.length ? `<div class="note note-info" style="margin-top:10px;">${escapeHtml(t('results.lang_note'))}</div>` : '';

    // ---- limitations ----
    const limitations = report.limitations || [];
    const limitationsHtml = limitations.length
      ? `<div class="limitations"><ul>${limitations.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ul></div>`
      : '';

    root.innerHTML = `
      <h1 data-i18n="results.title">${escapeHtml(t('results.title'))}</h1>
      <p class="subtitle">${escapeHtml(report.system && report.system.url ? report.system.url : '')}</p>
      ${notesHtml}
      ${heroHtml}
      <div class="section-title">${escapeHtml(t('results.dimension_detail'))}</div>
      ${dimsHtml}
      <div class="section-title">${escapeHtml(t('results.findings.title'))}</div>
      ${findingsHtml}
      ${langNote}
      ${limitationsHtml ? `<div class="section-title">${escapeHtml(t('results.limitations.title'))}</div>${limitationsHtml}` : ''}
    `;
  }

  const saved = localStorage.getItem('agentic-ds-lang') || 'es';
  setLang(saved); // also triggers the first render()
</script>

</body>
</html>
