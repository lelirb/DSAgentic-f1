<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic DS — Cómo funciona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#0B1220; --ink-800:#12172B; --ink-600:#3B4258;
    --gray-500:#5B6472; --gray-300:#9AA3B2; --gray-100:#E7EAF0;
    --paper:#FFFFFF; --paper-tint:#F3F5FA;
    --indigo-600:#3D5AFE; --indigo-700:#2F46D6; --indigo-100:#E8ECFF; --indigo-050:#F3F5FF;
    --green-700:#15803D; --green-100:#DCFCE7;
    --amber-700:#A15C00; --amber-100:#FEF3C7;
    --red-700:#B91C1C; --red-100:#FEE2E2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans', system-ui, sans-serif;color:var(--ink-800);background:var(--paper-tint);-webkit-font-smoothing:antialiased;line-height:1.6;}
  code{font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:.92em;background:var(--indigo-050);padding:1px 5px;border-radius:4px;}
  a{color:var(--indigo-700);}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:3px solid var(--indigo-600);outline-offset:2px;border-radius:4px;}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}
  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--gray-100);}
  nav.wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px;max-width:880px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;color:var(--ink-900);text-decoration:none;}
  .nav-right{display:flex;align-items:center;gap:16px;}
  .back-link{font-size:14px;font-weight:600;color:var(--indigo-700);text-decoration:none;}
  .lang-toggle{display:flex;align-items:center;background:var(--gray-100);border-radius:999px;padding:3px;gap:2px;}
  .lang-toggle button{border:none;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--gray-500);}
  .lang-toggle button[aria-pressed="true"]{background:var(--paper);color:var(--indigo-700);}
  main{padding:48px 0 96px;}
  h1{font-size:40px;line-height:1.15;letter-spacing:-.02em;margin:0 0 16px;color:var(--ink-900);}
  .lead{font-size:19px;color:var(--ink-600);margin:0 0 40px;}
  h2{font-size:22px;margin:48px 0 12px;color:var(--ink-900);}
  p{margin:0 0 14px;}
  ol.steps{list-style:none;counter-reset:s;padding:0;margin:20px 0 0;}
  ol.steps li{counter-increment:s;position:relative;padding:0 0 22px 52px;border-left:2px solid var(--indigo-100);margin-left:17px;}
  ol.steps li:last-child{border-left-color:transparent;}
  ol.steps li::before{content:counter(s);position:absolute;left:-18px;top:-2px;width:34px;height:34px;border-radius:50%;background:var(--indigo-600);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;}
  ol.steps h3{margin:0 0 4px;font-size:17px;color:var(--ink-900);}
  ol.steps p{margin:0;color:var(--ink-600);}
  .states{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px;}
  .state{background:var(--paper);border:1px solid var(--gray-100);border-radius:10px;padding:14px;}
  .state b{display:block;margin-bottom:4px;}
  .state span{font-size:14px;color:var(--ink-600);}
  .s-found b{color:var(--green-700);} .s-nf b{color:var(--amber-700);} .s-abs b{color:var(--red-700);} .s-ne b{color:var(--gray-500);}
  .rule{background:var(--paper);border-left:4px solid var(--indigo-600);padding:16px 18px;border-radius:0 8px 8px 0;margin-top:16px;}
  ul.plain{padding-left:20px;margin:8px 0 0;}
  ul.plain li{margin-bottom:6px;}
  .cta{display:inline-block;margin-top:40px;background:var(--indigo-600);color:#fff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:8px;}
  .cta:hover{background:var(--indigo-700);}
  @media (max-width:560px){h1{font-size:30px;}.lead{font-size:17px;}}
</style>
</head>
<body>
<header>
  <nav class="wrap">
    <a href="index.html" class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z" stroke="#3D5AFE" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 12l10 5 10-5" stroke="#3D5AFE" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 17l10 5 10-5" stroke="#3D5AFE" stroke-width="1.6" stroke-linejoin="round"/></svg>
      Agentic DS
    </a>
    <div class="nav-right">
      <a href="index.html" class="back-link" data-t="back"></a>
      <div class="lang-toggle" role="group" aria-label="Language selector / Selector de idioma">
        <button type="button" id="btn-es" aria-pressed="true">ES</button>
        <button type="button" id="btn-en" aria-pressed="false">EN</button>
      </div>
    </div>
  </nav>
</header>
<main class="wrap" id="content"></main>

<script>
(function () {
  const T = {
    es: {
      title: "Agentic DS — Cómo funciona",
      back: "Volver al inicio",
      h1: "Cómo funciona",
      lead: "Agentic DS revisa la documentación pública de un Design System y mide qué tan bien la podría usar un agente de IA. No usa IA para calificar: el resultado sale de reglas fijas, y siempre da lo mismo con la misma evidencia.",
      stepsTitle: "Qué pasa cuando pegas una dirección",
      steps: [
        ["Reconoce el Design System", "Puedes pegar la dirección principal o la de cualquier componente. Si pegas, por ejemplo, la página del botón, la herramienta detecta dónde empieza el Design System (todo lo que está antes de secciones como «components», «foundations» o «patterns»)."],
        ["Busca la lista de páginas", "Primero busca un llms.txt y un sitemap.xml en el inicio del Design System y del sitio. Si no los encuentra, usa el menú de navegación. Si tampoco hay menú legible, sigue los enlaces desde la dirección que pegaste."],
        ["Arma una muestra ordenada", "En lugar de leer las primeras páginas que aparezcan, elige algunos componentes repartidos a lo largo de la lista (con todas sus pestañas: uso, estilo, código, accesibilidad), algunos patrones, las páginas de tokens y el changelog. Lee hasta 45 páginas en menos de un minuto."],
        ["Abre con un navegador las páginas que lo necesitan", "Algunos sitios entregan una página vacía y arman su contenido con JavaScript. Cuando pasa eso, la herramienta carga la página con un navegador, espera a que termine y recién entonces la lee. Es más lento: una evaluación así puede tardar unos 4 minutos. El informe lo avisa, y D1 registra que ese contenido no está disponible sin JavaScript, porque muchos agentes no lo ejecutan."],
        ["Lee cada página", "Reconoce tablas de propiedades, variantes y tokens; secciones de estados, accesibilidad y anatomía; guías de uso («Cuándo usar», «When not to use»); restricciones («No uses…», «Don't…»); alternativas («en lugar de», «instead of»); demos en vivo; versión o fecha de actualización; y si el sistema declara un servidor MCP. Todo en español y en inglés."],
        ["Anota las fuentes oficiales", "Si la documentación enlaza su Storybook, su repositorio o sus paquetes publicados, los anota como fuentes oficiales. Esta versión todavía no las lee: lo que vive solo ahí queda fuera de la nota, no cuenta como 0."],
      ],
      statesTitle: "Cuatro estados para cada cosa que busca",
      states: [
        ["s-found", "Encontrado", "Lo buscó y está. Suma puntos."],
        ["s-nf", "No encontrado", "Lo buscó en lo que leyó y no apareció. Podría estar en otra página. Cuenta como 0."],
        ["s-abs", "No existe", "Hay certeza de que falta; por ejemplo, un llms.txt buscado en su dirección estándar. Cuenta como 0."],
        ["s-ne", "No se pudo leer", "No lo pudo buscar: la página no abrió, no se pudo cargar con el navegador o está en una fuente que todavía no lee. Queda fuera de la nota."],
      ],
      statesNote: "La diferencia entre «No encontrado» y «No existe» cambia la recomendación: en el primer caso se sugiere verificar si existe y hacerlo más fácil de encontrar; en el segundo, crearlo.",
      ruleTitle: "La regla de la mitad",
      rule: "La nota se calcula solo con lo que se pudo revisar. Si eso es menos de la mitad de lo que compone la nota, el informe muestra el número con un aviso y no asigna nivel (Opaco, Legible, Interpretable u Operable), porque con tan poca evidencia el nivel afirmaría más de lo que se sabe.",
      limitsTitle: "Qué todavía no puede leer",
      limits: [
        "Contenido que solo aparece al ejecutar JavaScript, cuando la página no llega a cargar a tiempo en el navegador del evaluador. Si carga, sí se lee; el informe lo avisa y D1 registra que el contenido no está disponible sin JavaScript.",
        "Páginas que piden iniciar sesión.",
        "Archivos de Figma (por eso D7, la consistencia entre diseño y código, no se evalúa).",
        "Storybook, repositorios y paquetes publicados: se anotan, pero todavía no se leen.",
        "Sitios de otros dominios que la documentación no declara como oficiales.",
        "Si un servidor MCP, una API, un llms.txt o un AGENTS.md funcionan o piden credenciales: solo se detecta que existen o que la documentación los menciona.",
        "Contradicciones entre fuentes (por ejemplo, entre una página y un archivo de tokens): esta versión no las busca.",
        "Qué componentes se parecen entre sí: no se detectan por separado, así que el criterio de desambiguación de D4 no cuenta en la nota. Las frases que comparan componentes se muestran como evidencia.",
        "La cantidad de páginas leídas puede variar entre una evaluación y otra del mismo sitio, sobre todo en sitios lentos o cuando se alcanza el límite de tiempo. Por eso dos evaluaciones pueden dar resultados algo distintos. El informe lista lo que se leyó en cada una.",
      ],
      safetyTitle: "Límites y seguridad",
      safety: "Cada evaluación lee hasta 45 páginas, con 5 MB como máximo por respuesta. El tiempo máximo es de 45 segundos; si alguna página necesita navegador, puede llegar a unos 4 minutos en total. No se visitan direcciones internas ni privadas. El resultado no se guarda en una base de datos ni en archivos del servidor (ver «Privacidad»).",
      privacyTitle: "Privacidad (nota provisional)",
      privacy: [
        "No necesitas cuenta. Para evaluar no se piden datos personales. El formulario de comentarios pide un contacto solo como dato opcional.",
        "Si envías un comentario, el servidor lo manda por correo al equipo de Agentic DS a través de Resend, un servicio de envío de correos, junto con la versión de las reglas y los puntajes del informe. El servidor no lo guarda; queda en ese correo y en los registros de Resend, que se rigen por sus propias políticas.",
        "La dirección que escribes se envía al servidor para evaluar ese sitio. El servidor visita sus páginas con su propia conexión; en las lecturas directas se identifica como «AgenticDS».",
        "El servidor no guarda los resultados en una base de datos ni en archivos. Mientras dura la evaluación, y hasta 10 minutos después, el resultado queda en su memoria para recuperarlo si se corta la conexión; luego se descarta.",
        "Para limitar el uso a 5 evaluaciones por minuto, el servidor guarda en memoria, durante uno o dos minutos, la dirección IP desde la que se pide cada evaluación.",
        "Si una evaluación falla por un error interno, el servidor registra ese error, que puede incluir la dirección evaluada.",
        "Tu navegador guarda el idioma elegido y el último resultado. El resultado se borra al cerrar la pestaña.",
        "La app no usa herramientas de analítica ni cookies de seguimiento. Las páginas cargan tipografías de Google Fonts, así que al abrirlas tu navegador se conecta a Google.",
        "La app está publicada en Render. No revisamos qué registros técnicos guarda Render (por ejemplo, direcciones IP u horas de acceso); se rigen por sus propias políticas.",
        "La política de privacidad completa está pendiente; los términos y condiciones están en su propia página. Esta nota describe lo que se comprobó en el código de la app.",
      ],
      cta: "Evaluar un Design System",
    },
    en: {
      title: "Agentic DS — How it works",
      back: "Back to home",
      h1: "How it works",
      lead: "Agentic DS reviews a Design System's public documentation and measures how well an AI agent could use it. It doesn't use AI to score: the result comes from fixed rules, and the same evidence always gives the same result.",
      stepsTitle: "What happens when you paste an address",
      steps: [
        ["It recognizes the Design System", "You can paste the main address or any component's address. If you paste, say, the button page, the tool detects where the Design System starts (everything before sections like “components”, “foundations” or “patterns”)."],
        ["It looks for the page list", "First it looks for llms.txt and sitemap.xml at the Design System's home and at the site's root. If it can't find them, it uses the navigation menu. If there's no readable menu either, it follows links from the address you pasted."],
        ["It builds an ordered sample", "Instead of reading whichever pages show up first, it picks components spread across the list (with all their tabs: usage, style, code, accessibility), some patterns, the token pages and the changelog. It reads up to 45 pages in under a minute."],
        ["It opens in a browser the pages that need it", "Some sites deliver an empty page and build their content with JavaScript. When that happens, the tool loads the page in a browser, waits for it to finish, and only then reads it. This is slower: such an evaluation can take about 4 minutes. The report says so, and D1 records that the content isn't available without JavaScript, because many agents don't run it."],
        ["It reads each page", "It recognizes property, variant and token tables; state, accessibility and anatomy sections; usage guidance (“When to use”, “Cuándo usar”); restrictions (“Don't…”, “No uses…”); alternatives (“instead of”, “en lugar de”); live demos; version or last-updated date; and whether the system declares an MCP server. All in English and Spanish."],
        ["It notes the official sources", "If the documentation links to its Storybook, repository or published packages, it notes them as official sources. This version doesn't read them yet: whatever lives only there is left out of the score, not counted as 0."],
      ],
      statesTitle: "Four states for everything it looks for",
      states: [
        ["s-found", "Found", "It looked and it's there. Adds points."],
        ["s-nf", "Not found", "It looked in what it read and it didn't show up. It may be on another page. Counts as 0."],
        ["s-abs", "Doesn't exist", "It's certain it's missing; for example, an llms.txt checked at its standard address. Counts as 0."],
        ["s-ne", "Couldn't be read", "It couldn't look: the page didn't open, couldn't be loaded in the browser, or lives in a source not read yet. Left out of the score."],
      ],
      statesNote: "The difference between “Not found” and “Doesn't exist” changes the recommendation: in the first case, check whether it exists and make it easier to find; in the second, create it.",
      ruleTitle: "The half rule",
      rule: "The score is calculated only from what could be reviewed. If that's less than half of what makes up the score, the report shows the number with a notice and doesn't assign a level (Opaque, Legible, Interpretable or Operable), because with so little evidence the level would claim more than is known.",
      limitsTitle: "What it can't read yet",
      limits: [
        "Content that only appears when JavaScript runs, when the page doesn\u2019t finish loading in time in the evaluator\u2019s browser. If it loads, it is read; the report says so and D1 records that the content isn\u2019t available without JavaScript.",
        "Pages behind a login.",
        "Figma files (that's why D7, design–code consistency, isn't evaluated).",
        "Storybook, repositories and published packages: they're noted, but not read yet.",
        "Sites on other domains that the documentation doesn't declare as official.",
        "Whether an MCP server, an API, an llms.txt or an AGENTS.md works or requires credentials: it only detects that they exist or that the documentation mentions them.",
        "Contradictions between sources (for example, between a page and a token file): this version doesn't look for them.",
        "Which components are similar to each other: they aren't detected separately, so D4's disambiguation criterion isn't part of the score. Sentences comparing components are shown as evidence.",
        "The number of pages read can vary from one evaluation of the same site to another, especially on slow sites or when the time limit is reached. So two evaluations may give somewhat different results. The report lists what was read in each one.",
      ],
      safetyTitle: "Limits and safety",
      safety: "Each evaluation reads up to 45 pages, with at most 5 MB per response. The time limit is 45 seconds; if any page needs a browser, it can reach about 4 minutes in total. Internal or private addresses are never visited. The result isn't stored in a database or in files on the server (see “Privacy”).",
      privacyTitle: "Privacy (provisional note)",
      privacy: [
        "You don't need an account. No personal data is requested to run an evaluation. The feedback form asks for contact details only as an optional field.",
        "If you send feedback, the server emails it to the Agentic DS team through Resend, an email delivery service, together with the report's rules version and scores. The server doesn't store it; it stays in that email and in Resend's logs, which are governed by Resend's own policies.",
        "The address you type is sent to the server to evaluate that site. The server visits its pages through its own connection; in direct reads it identifies itself as “AgenticDS”.",
        "The server doesn't store results in a database or in files. While the evaluation runs, and for up to 10 minutes after, the result stays in its memory so it can be recovered if the connection drops; then it's discarded.",
        "To limit use to 5 evaluations per minute, the server keeps in memory, for one or two minutes, the IP address each evaluation is requested from.",
        "If an evaluation fails because of an internal error, the server logs that error, which may include the evaluated address.",
        "Your browser stores the language you chose and the latest result. The result is deleted when you close the tab.",
        "The app doesn't use analytics tools or tracking cookies. The pages load fonts from Google Fonts, so when you open them your browser connects to Google.",
        "The app is hosted on Render. We haven't reviewed which technical logs Render keeps (for example, IP addresses or access times); they're governed by Render's own policies.",
        "The full privacy policy is still pending; the terms and conditions have their own page. This note describes what was checked in the app's code.",
      ],
      cta: "Evaluate a Design System",
    },
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let lang = "es";
  try { lang = localStorage.getItem("agentic-ds-lang") === "en" ? "en" : "es"; } catch {}

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelector('[data-t="back"]').textContent = t.back;
    document.getElementById("btn-es").setAttribute("aria-pressed", String(lang === "es"));
    document.getElementById("btn-en").setAttribute("aria-pressed", String(lang === "en"));
    document.getElementById("content").innerHTML = `
      <h1>${esc(t.h1)}</h1>
      <p class="lead">${esc(t.lead)}</p>
      <h2>${esc(t.stepsTitle)}</h2>
      <ol class="steps">${t.steps.map(([h, p]) => `<li><h3>${esc(h)}</h3><p>${esc(p)}</p></li>`).join("")}</ol>
      <h2>${esc(t.statesTitle)}</h2>
      <div class="states">${t.states.map(([c, b, s]) => `<div class="state ${c}"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("")}</div>
      <p style="margin-top:14px">${esc(t.statesNote)}</p>
      <h2>${esc(t.ruleTitle)}</h2>
      <div class="rule"><p style="margin:0">${esc(t.rule)}</p></div>
      <h2>${esc(t.limitsTitle)}</h2>
      <ul class="plain">${t.limits.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>
      <h2>${esc(t.safetyTitle)}</h2>
      <p>${esc(t.safety)}</p>
      <h2 id="privacidad">${esc(t.privacyTitle)}</h2>
      <ul class="plain">${t.privacy.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>
      <a class="cta" href="index.html#evaluate">${esc(t.cta)}</a>`;
  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem("agentic-ds-lang", l); } catch {}
    render();
  }
  document.getElementById("btn-es").addEventListener("click", () => setLang("es"));
  document.getElementById("btn-en").addEventListener("click", () => setLang("en"));
  render();
})();
</script>
<footer id="site-footer"></footer>
<script src="footer.js"></script>
</body>
</html>
