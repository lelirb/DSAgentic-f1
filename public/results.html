<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic DS — Resultado de la evaluación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#0B1220; --ink-800:#12172B; --ink-600:#3B4258;
    --gray-500:#5B6472; --gray-300:#9AA3B2; --gray-100:#E7EAF0;
    --paper:#FFFFFF; --paper-tint:#F3F5FA;
    --indigo-600:#3D5AFE; --indigo-700:#2F46D6; --indigo-100:#E8ECFF; --indigo-050:#F3F5FF;
    --green-700:#15803D; --green-100:#DCFCE7;
    --amber-700:#A15C00; --amber-100:#FEF3C7;
    --red-700:#B91C1C; --red-100:#FEE2E2;
    --focus-ring:#3D5AFE;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans', system-ui, sans-serif;color:var(--ink-800);background:var(--paper-tint);-webkit-font-smoothing:antialiased;line-height:1.55;}
  code{font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:.92em;}
  a{color:var(--indigo-700);}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px;border-radius:4px;}
  .wrap{max-width:880px;margin:0 auto;padding:0 24px;}
  .measure{max-width:68ch;}

  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--gray-100);}
  nav.wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;color:var(--ink-900);text-decoration:none;}
  .back-link{font-size:14px;font-weight:600;color:var(--indigo-700);text-decoration:none;}
  .lang-toggle{display:flex;align-items:center;background:var(--gray-100);border-radius:999px;padding:3px;gap:2px;}
  .lang-toggle button{border:none;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--gray-500);}
  .lang-toggle button[aria-pressed="true"]{background:var(--paper);color:var(--indigo-700);}

  main{padding:36px 0 96px;}

  /* ---------- 1–4: resultado general ---------- */
  .verdict{background:var(--paper);border:1px solid var(--gray-100);border-radius:18px;padding:32px 32px 28px;}
  .verdict h1{font-size:22px;line-height:1.3;font-weight:600;color:var(--ink-900);margin:0 0 6px;}
  .verdict .source{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px;color:var(--gray-500);margin:0 0 24px;word-break:break-all;}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--indigo-050);color:var(--indigo-700);white-space:nowrap;}
  .score-line{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .score-line .num{font-size:64px;font-weight:700;line-height:1;color:var(--ink-900);letter-spacing:-0.02em;}
  .score-line .of{font-size:22px;color:var(--gray-300);font-weight:500;}
  .score-line .band{font-size:24px;font-weight:600;}
  .band-Operable{color:var(--green-700);} .band-Interpretable{color:var(--indigo-700);}
  .band-Legible{color:var(--amber-700);} .band-Opaco{color:var(--red-700);}
  .score-line .none{font-size:20px;font-weight:600;color:var(--gray-500);}

  .scale{position:relative;display:grid;grid-template-columns:25fr 25fr 25fr 25fr;gap:3px;margin:4px 0 26px;}
  .scale .seg{height:8px;background:var(--gray-100);}
  .scale .seg:first-child{border-radius:99px 0 0 99px;} .scale .seg:last-child{border-radius:0 99px 99px 0;}
  .scale .seg.on{background:currentColor;}
  .scale .lbl{font-size:12px;color:var(--gray-500);margin-top:6px;}
  .scale .lbl.on{color:var(--ink-900);font-weight:600;}
  .scale .marker{position:absolute;top:-5px;width:4px;height:18px;border-radius:2px;background:var(--ink-900);transform:translateX(-2px);}

  .summary{font-size:18px;line-height:1.5;color:var(--ink-900);margin:0 0 16px;}
  .note{font-size:14px;border-radius:10px;padding:10px 14px;margin:0 0 12px;}
  .note-warn{background:var(--amber-100);color:#7A4400;}

  .cap-lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px;margin:22px 0 20px;padding:20px 0 0;border-top:1px solid var(--gray-100);}
  .cap-lists h2{font-size:14.5px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px;}
  .cap-lists ul{margin:0;padding:0;list-style:none;font-size:14.5px;color:var(--ink-600);}
  .cap-lists li{padding:4px 0 4px 22px;position:relative;}
  .cap-lists li::before{position:absolute;left:0;top:4px;font-weight:700;}
  .cap-good li::before{content:"✓";color:var(--green-700);}
  .cap-infer li::before{content:"?";color:var(--amber-700);}
  .cap-bad li::before{content:"✕";color:var(--red-700);}
  .cap-na li::before{content:"–";color:var(--gray-300);}
  .cap-lists .dref{color:var(--gray-300);font-size:12.5px;white-space:nowrap;}
  .conclusion{font-size:15.5px;color:var(--ink-800);margin:0 0 14px;}
  .score-note{font-size:13px;color:var(--gray-500);margin:0;}

  /* ---------- cadena de capacidades ---------- */
  h2.section{font-size:20px;font-weight:600;color:var(--ink-900);margin:48px 0 6px;}
  p.section-lead{font-size:14.5px;color:var(--gray-500);margin:0 0 18px;}
  .chain{display:grid;grid-template-columns:repeat(7,1fr);gap:0;background:var(--paper);border:1px solid var(--gray-100);border-radius:14px;overflow:hidden;}
  .chain a{display:block;padding:14px 12px 12px;text-decoration:none;color:inherit;border-right:1px solid var(--gray-100);position:relative;}
  .chain a:last-child{border-right:none;}
  .chain a:hover{background:var(--indigo-050);}
  .chain .verb{font-size:15.5px;font-weight:600;color:var(--ink-900);margin:0 0 6px;}
  .chain .val{font-size:22px;font-weight:700;line-height:1.1;}
  .chain .val.muted{color:var(--gray-300);font-weight:600;}
  .chain .bar{height:4px;background:var(--gray-100);border-radius:99px;margin:6px 0 10px;overflow:hidden;}
  .chain .bar i{display:block;height:100%;}
  .chain .step{font-size:12px;line-height:1.35;color:var(--gray-500);}
  .bg-band-Operable{background:var(--green-700);} .bg-band-Interpretable{background:var(--indigo-600);}
  .bg-band-Legible{background:var(--amber-700);} .bg-band-Opaco{background:var(--red-700);}

  /* ---------- 5–6: dimensiones ---------- */
  .dim{background:var(--paper);border:1px solid var(--gray-100);border-radius:16px;margin:0 0 20px;scroll-margin-top:80px;}
  .dim-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:24px 28px 18px;border-bottom:1px solid var(--gray-100);}
  .dim-head h3{font-size:20px;font-weight:600;margin:0 0 6px;color:var(--ink-900);}
  .capchip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:6px;background:var(--indigo-100);color:var(--indigo-700);}
  .dim-head .dscore{text-align:right;white-space:nowrap;}
  .dim-head .dscore b{font-size:30px;line-height:1;}
  .dim-head .dscore span{color:var(--gray-300);font-size:15px;}
  .dim-head .dscore .na{font-size:15px;color:var(--gray-500);font-weight:600;}

  .about{background:var(--paper-tint);padding:18px 28px 6px;}
  .about .group{font-size:13px;font-weight:600;color:var(--gray-500);margin:0 0 10px;}
  .qa{margin:0 0 14px;}
  .qa h4{font-size:14.5px;font-weight:600;color:var(--ink-900);margin:0 0 3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .qa p,.qa li{font-size:14.5px;color:var(--ink-600);}
  .qa p{margin:0 0 6px;}
  .qa ul,.qa ol{margin:4px 0 8px;padding-left:20px;}
  .qa li{margin:2px 0;}
  .body{padding:20px 28px 8px;}
  .body .group{font-size:13px;font-weight:600;color:var(--gray-500);margin:0 0 12px;}
  .tag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;}
  .tag-ev{background:var(--indigo-050);color:var(--indigo-700);}
  .tag-in{background:var(--gray-100);color:var(--ink-600);}
  .tag-re{background:var(--green-100);color:var(--green-700);}
  .tag-li{background:var(--amber-100);color:#7A4400;}
  .limit{background:var(--amber-100);color:#5C3500;border-radius:8px;padding:8px 12px;font-size:14px;margin:8px 0;}
  .result-line{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:14px 28px;border-top:1px solid var(--gray-100);font-size:14.5px;}
  .result-line b{font-size:15px;}

  details.tech{border-top:1px solid var(--gray-100);}
  details.tech summary{padding:14px 28px;font-size:14px;font-weight:600;color:var(--indigo-700);cursor:pointer;list-style-position:inside;}
  details.tech[open] summary{border-bottom:1px solid var(--gray-100);}
  .tech-body{padding:14px 28px 20px;overflow-x:auto;}
  table.ev{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.ev th{text-align:left;font-weight:600;color:var(--gray-500);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--gray-100);}
  table.ev td{padding:7px 8px;border-bottom:1px solid var(--gray-100);vertical-align:top;color:var(--ink-600);}
  table.ev td.pts{font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .st{font-weight:600;white-space:nowrap;}
  table.ev td.st-found{color:var(--green-700);} table.ev td.st-partial{color:var(--amber-700);} table.ev td.st-gap{color:var(--red-700);} table.ev td.st-na,table.ev td.st-ne{color:var(--gray-500);}
  .tech-meta{font-size:13px;color:var(--gray-500);margin:12px 0 0;}
  .finding{font-size:13.5px;color:var(--ink-600);border-left:3px solid var(--gray-100);padding:2px 0 2px 12px;margin:10px 0;}


  /* ---------- certeza de la evidencia ---------- */
  .cert-badge{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;vertical-align:middle;white-space:nowrap;}
  .cb-incomplete{background:var(--amber-100);color:#7A4400;}
  .cb-complete{background:var(--green-100);color:var(--green-700);}
  .score-line .cert-badge{align-self:center;}
  .incomplete-box{background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:14px 18px;margin:0 0 18px;font-size:14.5px;color:#5C3500;}
  .incomplete-box p{margin:0 0 6px;} .incomplete-box p:last-child{margin:6px 0 0;}
  .incomplete-box ul{margin:4px 0;padding-left:20px;}
  .cert-sum{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0 0;font-size:12.5px;color:var(--gray-500);}
  .cert-sum span{display:inline-flex;align-items:center;gap:6px;}
  .cert-sum i,table.ev td.st i{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;}
  table.ev td.st i{margin-right:6px;vertical-align:0;}
  .c-dem i{background:var(--green-700);} .c-par i{background:linear-gradient(90deg,var(--green-700) 50%,#E5B94E 50%);}
  .c-nd i{background:#E5B94E;} .c-abs i{background:var(--red-700);} .c-ne i{background:var(--gray-300);}
  .c-na i{background:transparent;border:1.5px solid var(--gray-300);}
  table.ev td.c-dem{color:var(--green-700);} table.ev td.c-par{color:var(--green-700);} table.ev td.c-nd{color:var(--amber-700);}
  table.ev td.c-abs{color:var(--red-700);} table.ev td.c-ne,table.ev td.c-na{color:var(--gray-500);}
  .why{color:var(--gray-500);}
  .why-lead{color:var(--gray-500);font-size:13.5px;margin:2px 0 0!important;}
  .partial-lead{background:var(--paper-tint);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--ink-800);}
  .cert-inline{font-weight:600;color:var(--amber-700);}
  .dim-head .demo-cap{font-size:12px;color:var(--gray-500);margin-top:2px;}
  .chain .inc{font-size:11.5px;color:var(--amber-700);font-weight:600;margin:-4px 0 6px;}
  .cap-nd li::before{content:"?";color:var(--amber-700);}
  /* ---------- 7: limitaciones ---------- */
  .limitations{background:var(--paper);border:1px solid var(--gray-100);border-radius:14px;padding:18px 24px;}
  .limitations ul{margin:0;padding-left:18px;color:var(--ink-600);font-size:14px;}
  .limitations li{margin:5px 0;}

  .empty-state{background:var(--paper);border:1px solid var(--gray-100);border-radius:16px;padding:48px 24px;text-align:center;}
  .empty-state h2{font-size:18px;color:var(--ink-900);margin:0 0 8px;}
  .empty-state p{color:var(--gray-500);font-size:14px;margin:0 0 20px;}
  .btn-primary{display:inline-block;padding:11px 20px;border-radius:10px;font-size:15px;font-weight:600;text-decoration:none;background:var(--indigo-600);color:#fff;}

  @media (max-width:760px){
    .chain{grid-template-columns:repeat(2,1fr);}
    .chain a{border-bottom:1px solid var(--gray-100);}
    .verdict{padding:24px 20px;}
    .dim-head,.about,.body,.result-line,details.tech summary,.tech-body{padding-left:18px;padding-right:18px;}
    .score-line .num{font-size:52px;}
    .back-link{display:none;}
  }
  @media print{ header{position:static;} details.tech{display:block;} }
</style>
</head>

<header>

    </a>

      <button type="button" id="btn-es" aria-pressed="true">ES</button>
      <button type="button" id="btn-en" aria-pressed="false">EN</button>
    </div>
  </nav>
</header>

<main class="wrap" id="page-root"></main>
