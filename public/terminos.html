<style>
  :root{

    --paper:#FFFFFF; --paper-tint:#F3F5FA;

  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans', system-ui, sans-serif;color:var(--ink-800);background:var(--paper-tint);-webkit-font-smoothing:antialiased;line-height:1.6;}
  a{color:var(--indigo-700);}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:3px solid var(--indigo-600);outline-offset:2px;border-radius:4px;}
  .skip{position:absolute;left:12px;top:-60px;background:var(--paper);color:var(--indigo-700);font-weight:600;padding:10px 14px;border-radius:8px;z-index:100;}
  .skip:focus{top:12px;}
  .wrap{max-width:880px;margin:0 auto;padding:0 24px;}
  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--gray-100);}
  nav.wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;color:var(--ink-900);text-decoration:none;}
  .back-link{font-size:14px;font-weight:600;color:var(--indigo-700);text-decoration:none;}
  .lang-toggle{display:flex;align-items:center;background:var(--gray-100);border-radius:999px;padding:3px;gap:2px;}
  .lang-toggle button{border:none;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--gray-500);min-height:32px;}
  .lang-toggle button[aria-pressed="true"]{background:var(--paper);color:var(--indigo-700);}
  main{padding:40px 0 24px;}
  .doc{max-width:680px;margin:0 auto;}
  h1{font-size:32px;line-height:1.2;font-weight:600;color:var(--ink-900);margin:0 0 6px;}
  .updated{font-size:14px;color:var(--gray-500);margin:0 0 20px;}
  .intro{font-size:16.5px;color:var(--ink-600);margin:0 0 28px;}
  .toc{background:var(--paper);border:1px solid var(--gray-100);border-radius:12px;padding:14px 20px;margin:0 0 32px;}
  .toc p{margin:0 0 6px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gray-500);}
  .toc ol{margin:0;padding-left:20px;columns:2;column-gap:28px;font-size:14.5px;}
  .toc li{margin:3px 0;break-inside:avoid;}
  section{scroll-margin-top:84px;}
  h2{font-size:19px;color:var(--ink-900);margin:32px 0 8px;}
  p{margin:0 0 12px;}
  ul{margin:0 0 12px;padding-left:20px;}
  li{margin:4px 0;}
  @media (max-width:600px){ h1{font-size:26px;} .toc ol{columns:1;} .back-link{display:none;} }

</head>

        ["responsabilidad", "Limitation of liability", [

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const block = (b) =>
    typeof b === "string" ? `<p>${esc(b)}</p>`
    : b.list ? `<ul>${b.list.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`
    : `<p>${b.html}</p>`; // solo textos fijos de este archivo
  let lang = "es";
  try { lang = localStorage.getItem("agentic-ds-lang") === "en" ? "en" : "es"; } catch {}
  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.getAttribute("data-t")]; });
    document.getElementById("btn-es").setAttribute("aria-pressed", String(lang === "es"));
    document.getElementById("btn-en").setAttribute("aria-pressed", String(lang === "en"));
    document.getElementById("doc").innerHTML = `
      <h1>${esc(t.h1)}</h1>
      <p class="updated">${esc(t.updated.replace("{date}", UPDATED[lang]))}</p>
      <p class="intro">${esc(t.intro)}</p>
      <nav class="toc" aria-label="${esc(t.toc)}"><p>${esc(t.toc)}</p><ol>${t.sections.map(([id, h]) => `<li><a href="#${id}">${esc(h)}</a></li>`).join("")}</ol></nav>

  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem("agentic-ds-lang", l); } catch {}
    render();
  }
  document.getElementById("btn-es").addEventListener("click", () => setLang("es"));
  document.getElementById("btn-en").addEventListener("click", () => setLang("en"));
  render();

</script>
<script src="footer.js"></script>

</html>
