  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const block = (b) =>
    b.p !== undefined ? `<p>${b.p}</p>`
    : b.callout !== undefined ? `<div class="callout"><p style="margin:0">${b.callout}</p></div>`
    : b.h3 !== undefined ? `<h3>${b.h3}</h3>`
    : b.ul ? `<ul>${b.ul.map((x) => `<li>${x}</li>`).join("")}</ul>`
    : b.steps ? `<ol class="steps">${b.steps.map(([h, bs]) => `<li><h3>${h}</h3>${bs.map(block).join("")}</li>`).join("")}</ol>`
    : b.states ? `<div class="states">${b.states.map(([c, l, s]) => `<div class="state ${c}"><b>${l}</b><span>${s}</span></div>`).join("")}</div>`
    : "";
  let lang = "es";
  try { lang = localStorage.getItem("agentic-ds-lang") === "en" ? "en" : "es"; } catch {}
  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.getAttribute("data-t")]; });
    document.getElementById("btn-es").setAttribute("aria-pressed", String(lang === "es"));
    document.getElementById("btn-en").setAttribute("aria-pressed", String(lang === "en"));
    document.getElementById("doc").innerHTML = `
      <h1>${esc(t.h1)}</h1>
      ${t.updated ? `<p class="updated">${esc(t.updatedLabel)}: ${esc(t.updated)}</p>` : ""}
      <div class="intro">${t.intro.map(block).join("")}</div>
      <nav class="toc" aria-label="${esc(t.toc)}"><p>${esc(t.toc)}</p><ol>${t.sections.map(([id, h]) => `<li><a href="#${id}">${h}</a></li>`).join("")}</ol></nav>
      ${t.sections.map(([id, h, blocks], i) => `<section id="${id}"><h2>${i + 1}. ${h}</h2>${blocks.map(block).join("")}</section>`).join("")}
      ${t.outro.length ? `<div class="outro">${t.outro.map(block).join("")}</div>` : ""}
      ${t.cta ? `<a class="cta" href="index.html#evaluate">${esc(t.cta)}</a>` : ""}`;
    if (typeof location !== "undefined" && location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem("agentic-ds-lang", l); } catch {}
    render();
  }
  document.getElementById("btn-es").addEventListener("click", () => setLang("es"));
  document.getElementById("btn-en").addEventListener("click", () => setLang("en"));
  render();
})();
